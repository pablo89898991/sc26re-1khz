name: overlay app

# The Windows overlay app (desktop/): a portable .exe with the web pages inside, put on the
# "overlay-app" pre-release (replaced on every build).
on:
  push:
    branches: [master]
    paths: ['desktop/**', 'web/overlay.html', 'web/overlay_settings.js', 'web/actnames.js', 'web/remap.html', 'web/vdf.js', 'web/stickcal.js', 'web/models/**', 'web/vendor/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: SC2-Overlay
          path: desktop/dist/*.exe
      - name: Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls desktop/dist/*.exe | head -1)
          cp "$exe" SC2-Overlay.exe
          gh release view overlay-app >/dev/null 2>&1 || gh release create overlay-app --prerelease --title "SC2 Overlay (Windows app)" \
            --notes "See-through on-screen menus and 3D controller over games. Download SC2-Overlay.exe and run it (no install). Tray icon: Arrange, Remapper and overlay settings, Screen, Start with Windows. Ctrl+Shift+F10 arranges, Ctrl+Shift+F9 shows / hides. Works over games in a window or borderless full screen (not exclusive full screen)."
          gh release upload overlay-app SC2-Overlay.exe --clobber
          git tag -f overlay-app "$GITHUB_SHA" && git push -f origin overlay-app || true
