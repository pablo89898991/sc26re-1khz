name: build

on:
  push:
    branches: [master, imu-1khz]
    tags: ['v*']
    paths-ignore: ['web/**', 'docs/*', '*.md', 'valve/**', 'tools/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ibex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build device-tree-compiler \
            python3-pip python3-venv gperf ccache xz-utils file
          pip install --user --break-system-packages west pyelftools pykwalify jsonschema packaging

      - name: Git identity (patch stack is applied with git am)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Cache Zephyr SDK and workspace
        uses: actions/cache@v4
        with:
          path: |
            sdk
            zephyr/.west
            zephyr/zephyr
            zephyr/modules
          key: zephyr-${{ hashFiles('manifests/**', 'Makefile', 'patches/**') }}

      - name: Build controller firmware
        run: |
          make app-ibex
          mkdir -p out
          cp "$(ls -t zephyr/build-app-ibex/zephyr/IBEX_CUSTOM_*.fw | head -1)" out/SC26RE_1k.fw

      - name: Build diagnostics variant (Puck link counters in quaternion)
        run: |
          printf 'CONFIG_IBEX_ESB_DEBUG_IN_QUAT=y\n' >> app/prj.conf
          make app-ibex
          cp "$(ls -t zephyr/build-app-ibex/zephyr/IBEX_CUSTOM_*.fw | head -1)" out/SC26RE_1k_puck_dbg.fw
          git checkout app/prj.conf

      - uses: actions/upload-artifact@v4
        with:
          name: sc26re-1khz-firmware
          path: out/*.fw
          if-no-files-found: error

      - name: Publish rolling "latest" release (master)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.fw --target "$GITHUB_SHA" --latest=false --prerelease \
            --title "sc26re 1 kHz — latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Automatic build of \`master\` at ${GITHUB_SHA}.
          - **SC26RE_1k.fw** – controller firmware (flash with Ibex Web Utilities or flash.py)
          - **SC26RE_1k_puck_dbg.fw** – same, with Puck link counters in the quaternion fields
          Puck firmware: patch your own PROTEUS_FW in the [web patcher](https://pablo89898991.github.io/sc26re-1khz/patcher.html)."

      - name: Publish versioned release from docs/releases (master)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls docs/releases/v*.md 2>/dev/null | sort -V | tail -1)
          [ -n "$f" ] || exit 0
          tag=$(basename "$f" .md)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" out/*.fw --target "$GITHUB_SHA" --latest \
            --title "sc26re 1 kHz $tag" --notes-file "$f"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a hand-written release for the tag may already exist: only attach the CI builds then
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.fw --clobber
          elif [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            gh release create "$GITHUB_REF_NAME" out/*.fw --latest --title "sc26re 1 kHz $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" out/*.fw --latest --title "sc26re 1 kHz $GITHUB_REF_NAME" --generate-notes
          fi
