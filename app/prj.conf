CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_SENSOR=y
CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_REBOOT=y
CONFIG_POWEROFF=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_PROMPT_UART="steamctl> "

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 1 kHz IMU path: no FIFO timestamp words (times come from the read timestamp)
CONFIG_LSM6DSV16X_STREAM_FIFO_TIMESTAMP=n
# I2C RTIO transfers run on the RTIO work queue; at the default priority 10 they
# queued behind the report loop (main, 10) and added ~1 ms to every FIFO read.
CONFIG_RTIO_WORKQ_THREADS_POOL_PRIO=2
# IMU reads paced by USB frames (imu_pace 0)
CONFIG_UDC_ENABLE_SOF=y
# SOF events share the queue with transfers; room for bursts
CONFIG_USBD_MAX_UDC_MSG=32
# saving Live settings (NVS) runs in the USB thread: 1024 overflowed
CONFIG_USBD_THREAD_STACK_SIZE=2048
